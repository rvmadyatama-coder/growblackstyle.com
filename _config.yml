title: "GROWBLACKSTYLE"
description: "Media digital tentang otomotif, industri, bisnis, teknologi, regulasi, dan perkembangan Indonesia."
url: "https://growblackstyle.com"
baseurl: ""
lang: "id-ID"
timezone: "Asia/Jakarta"
markdown: kramdown
permalink: /berita/:categories/:title/
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
exclude:
  - README.md
  - README-ID.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
collections:
  berita:
    output: true
    permalink: /berita/:categories/:title/
defaults:
  - scope:
      path: ""
      type: berita
    values:
      layout: artikel
      lang: id
