name: Protect News Media

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  protect-media:
    name: protect-media
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block deleted news media
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          DELETED=$(git diff --no-renames --name-status "$BASE" "$HEAD" |
            awk '$1 == "D" && $2 ~ /^assets\/uploads\// {print $2}')

          if [ -n "$DELETED" ]; then
            echo "::error::Penghapusan media berita diblokir."
            echo "$DELETED"
            exit 1
          fi

          echo "PASS: Tidak ditemukan penghapusan media berita."
