name: Protect News Media

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  protect-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect deleted media files
        shell: bash
        run: |
          set -e

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          DELETED=$(git diff --no-renames --name-status "$BASE" "$HEAD" | awk '$1 == "D" && $2 ~ /^assets\/uploads\// {print $2}')

          if [ -n "$DELETED" ]; then
            echo "ERROR: Media files were deleted:"
            echo "$DELETED"
            echo ""
            echo "Media deletion requires manual review."
            exit 1
          fi

          echo "No deleted media files detected."

